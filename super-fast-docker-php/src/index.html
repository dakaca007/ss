<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H5 响应式手机论坛</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-3">
  <h2 class="text-center mb-4">H5 响应式手机论坛</h2>
  <div id="user-section" class="mb-3">
    <input type="text" id="username" class="form-control mb-2" placeholder="用户名">
    <input type="password" id="password" class="form-control mb-2" placeholder="密码">
    <button class="btn btn-primary w-100 mb-2" onclick="register()">注册</button>
    <button class="btn btn-success w-100" onclick="login()">登录</button>
    <div id="user-info" class="mt-2"></div>
  </div>
  <div id="forum-section" style="display:none;">
    <h4>发帖</h4>
    <input type="text" id="post-title" class="form-control mb-2" placeholder="标题">
    <textarea id="post-content" class="form-control mb-2" placeholder="内容"></textarea>
    <button class="btn btn-warning w-100 mb-3" onclick="createPost()">发帖</button>
    <h4>帖子列表</h4>
    <div id="post-list"></div>
  </div>
</div>
<script>
let user = null;
function register() {
  fetch('User.php', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: `action=register&username=${username.value}&password=${password.value}`
  }).then(r=>r.text()).then(alert);
}
function login() {
  fetch('User.php', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: `action=login&username=${username.value}&password=${password.value}`
  }).then(r=>r.text()).then(res=>{
    try {
      user = JSON.parse(res);
      userInfo.innerHTML = `欢迎，${user.username}`;
      userSection.style.display = 'none';
      forumSection.style.display = '';
      loadPosts();
    } catch { alert('登录失败'); }
  });
}
function createPost() {
  if (!user) return alert('请先登录');
  fetch('Post.php', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: `action=create&forum_id=1&user_id=${user.id}&title=${postTitle.value}&content=${postContent.value}`
  }).then(r=>r.text()).then(res=>{
    alert(res); loadPosts();
  });
}
function loadPosts() {
  fetch('Post.php?forum_id=1').then(r=>r.json()).then(list=>{
    postList.innerHTML = list.map(p=>`<div class='card mb-2'><div class='card-body'><h5>${p.title}</h5><p>${p.content}</p><small>by ${p.username} @ ${p.created_at}</small></div></div>`).join('');
  });
}
</script>
</body>
</html>
