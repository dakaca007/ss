version: '3.8'

services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - redis

  php:
    build:
      context: .
      dockerfile: php.Dockerfile
    volumes:
      - ./src:/var/www/html

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  srs:
    build:
      context: .
      dockerfile: srs.Dockerfile
    ports:
      - "1935:1935"   # RTMP 推流端口
      - "8080:8080"   # HTTP-FLV/HLS 拉流端口
    volumes:
      - ./srs.conf:/usr/local/srs/conf/srs.conf